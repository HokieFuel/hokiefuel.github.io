<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hokie Fuel – VT Dining Meal Matcher</title>
<meta name="description" content="Answer a few questions and get the Virginia Tech dining hall plate that fits your goal, from today's real menu.">

<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hokie Fuel">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#861F41; --maroon-2:#a3284f; --orange:#E5751F; --orange-2:#f39a4c;
  --bg:#f7f4f2; --ink:#1c1417; --mut:#7a6f73; --line:rgba(28,20,23,.08);
  --glass:rgba(255,255,255,.72); --ok:#1f8a55;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.55;z-index:0;pointer-events:none;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.b1{width:520px;height:520px;background:var(--orange-2);top:-180px;right:-160px}
.b2{width:460px;height:460px;background:#c9577d;bottom:-200px;left:-160px;opacity:.35}
.shell{position:relative;z-index:1;max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(22px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left))}

.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.2px}
.logo{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--maroon),var(--orange));display:grid;place-items:center;color:#fff;font-size:15px}
.counter{display:flex;align-items:center;gap:8px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);padding:7px 13px;border-radius:99px;font-size:13px;font-weight:600;color:var(--mut);white-space:nowrap}
.counter b{color:var(--maroon);font-size:15px;min-width:18px;text-align:right;font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 4px rgba(229,117,31,.18);animation:pulse 1.8s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(229,117,31,0)}}
.fresh{font-size:12px;color:var(--mut);margin-top:10px;display:flex;align-items:center;gap:6px}
.fresh i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block}
.fresh.demo i{background:var(--orange)}

.steps{display:flex;gap:6px;margin:16px 0 0}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}
.steps i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--maroon),var(--orange));transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.steps i.on::after{transform:scaleX(1)}

.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:30px 0 10px}
.view{animation:in .55s cubic-bezier(.2,.8,.2,1) both}
.view.out{animation:out .28s ease-in both}
@keyframes in{from{opacity:0;transform:translateY(18px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes out{to{opacity:0;transform:translateY(-14px);filter:blur(4px)}}

.greet{font-size:15px;font-weight:600;color:var(--maroon);display:flex;align-items:center;gap:8px;margin-bottom:12px}
.greet .emoji{font-size:20px}
h1{font-size:clamp(30px,7vw,42px);line-height:1.08;letter-spacing:-1.2px;font-weight:800;margin-bottom:10px}
h1 em{font-family:Fraunces,serif;font-style:italic;font-weight:600;color:var(--maroon);letter-spacing:-.5px}
.sub{color:var(--mut);font-size:15.5px;margin-bottom:24px;line-height:1.5}

.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 16px;border-radius:18px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);transition:transform .18s,border-color .18s,background .18s,box-shadow .18s;animation:in .5s cubic-bezier(.2,.8,.2,1) both}
.opt:hover{transform:translateY(-2px);border-color:rgba(134,31,65,.35);box-shadow:0 10px 30px -14px rgba(134,31,65,.35)}
.opt.sel{background:#fff;border-color:var(--maroon);box-shadow:0 0 0 1.5px var(--maroon),0 12px 30px -16px rgba(134,31,65,.5)}
.ico{width:42px;height:42px;flex:none;border-radius:13px;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,#fff,#f4ebee);border:1px solid var(--line)}
.opt.sel .ico{background:linear-gradient(135deg,var(--maroon),var(--orange));border-color:transparent}
.opt b{display:block;font-size:15.5px;font-weight:700}
.opt small{color:var(--mut);font-size:13px}
.chk{margin-left:auto;width:22px;height:22px;flex:none;border-radius:7px;border:1.5px solid rgba(28,20,23,.18);display:grid;place-items:center;font-size:13px;color:#fff;transition:.15s}
.opt.sel .chk{background:var(--maroon);border-color:var(--maroon)}

.foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px}
.back{color:var(--mut);font-weight:600;font-size:14px;padding:10px 4px}
.back:hover{color:var(--ink)}
.cta{background:var(--ink);color:#fff;font-weight:700;padding:14px 22px;border-radius:99px;font-size:15px;display:flex;gap:8px;align-items:center;transition:transform .15s,opacity .15s}
.cta:hover{transform:translateY(-1px)}
.cta:disabled{opacity:.25;cursor:not-allowed;transform:none}

.loading{text-align:center}
.spinner{width:58px;height:58px;margin:0 auto 18px;border-radius:50%;background:conic-gradient(var(--maroon),var(--orange),transparent 75%);-webkit-mask:radial-gradient(farthest-side,transparent 70%,#000 71%);mask:radial-gradient(farthest-side,transparent 70%,#000 71%);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}

/* results */
.hero{border-radius:28px;padding:24px;color:#fff;background:radial-gradient(120% 120% at 100% 0%,var(--orange) 0%,var(--maroon-2) 45%,var(--maroon) 100%);box-shadow:0 30px 60px -30px rgba(134,31,65,.7);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;border:1px solid rgba(255,255,255,.18);right:-90px;bottom:-120px;pointer-events:none}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;background:rgba(255,255,255,.18);padding:5px 10px;border-radius:99px}
.pill.open::before{content:"";width:6px;height:6px;border-radius:50%;background:#7dffb3}
.hero h2{font-size:24px;line-height:1.15;letter-spacing:-.6px;margin:14px 0 2px;font-weight:800;padding-right:70px}
.hero .where{opacity:.85;font-weight:600;font-size:14px}
.match{position:absolute;top:22px;right:22px;text-align:right}
.match b{font-size:30px;font-weight:800;display:block;line-height:1}
.match small{font-size:11px;opacity:.8}
.plate{margin:16px 0 4px;display:grid;gap:8px}
.pi{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.12);border-radius:14px;padding:10px 12px}
.pi .q{width:30px;height:30px;flex:none;border-radius:9px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:15px}
.pi b{display:block;font-size:14.5px;line-height:1.25}
.pi small{opacity:.78;font-size:12px}
.pi .k{margin-left:auto;text-align:right;font-size:12px;opacity:.9;white-space:nowrap}
.order{margin:16px 0 4px;display:grid;gap:8px}
.ostep{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.12);border-radius:14px;padding:10px 12px}
.ostep .num{width:26px;height:26px;flex:none;border-radius:50%;background:#fff;color:var(--maroon);display:grid;place-items:center;font-weight:800;font-size:13px;margin-top:2px}
.ostep small{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;opacity:.75;font-weight:700;margin-bottom:5px}
.ob{flex:1;min-width:0}
.ob .chips{display:flex;flex-wrap:wrap;gap:6px}
.ob .chip{background:rgba(255,255,255,.18);border-radius:10px;padding:6px 9px;line-height:1.2}
.ob .chip b{display:block;font-size:14px}
.ob .chip em{font-style:normal;font-size:11.5px;opacity:.8}
.ob .chip.none{background:transparent;border:1px dashed rgba(255,255,255,.4)}
.skipline{font-size:12.5px;opacity:.85;padding:2px 4px}
.mrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 16px}
.m{background:rgba(255,255,255,.14);border-radius:14px;padding:10px}
.m b{font-size:19px;font-weight:800;display:block}
.m small{font-size:11.5px;opacity:.8}
.bar{height:4px;border-radius:4px;background:rgba(255,255,255,.2);margin-top:7px;overflow:hidden}
.bar span{display:block;height:100%;background:#fff;border-radius:4px;width:0;transition:width 1s .3s cubic-bezier(.2,.8,.2,1)}
.why{list-style:none;padding:0;display:grid;gap:7px;position:relative;z-index:1}
.why li{font-size:14px;display:flex;gap:9px;align-items:flex-start}
.why li::before{content:"✓";flex:none;width:19px;height:19px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:11px;font-weight:800;margin-top:1px}
.contains{font-size:12.5px;color:var(--mut);margin:12px 4px 0;line-height:1.5}
.contains b{color:var(--ink)}

.h3{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.7px;margin:26px 0 10px}
.alt{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;margin-bottom:9px;animation:in .5s cubic-bezier(.2,.8,.2,1) both;width:100%;text-align:left;transition:transform .15s,border-color .15s}
.alt:hover{transform:translateY(-2px);border-color:rgba(134,31,65,.35)}
.alt .n{font-weight:700;font-size:14.5px;line-height:1.3}
.alt .hall{font-weight:600;color:var(--mut);font-size:13px}
.alt .items{font-size:13.5px;margin-top:2px;line-height:1.35}
.onestop{font-size:12.5px;opacity:.85;margin-top:6px}
.alt .meta{font-size:12.5px;color:var(--mut);margin-top:3px}
.alt .sc{margin-left:auto;font-weight:800;color:var(--maroon);font-size:17px;text-align:right}
.alt .sc small{display:block;font-size:10.5px;color:var(--mut);font-weight:600}
.status{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.status.closed::before{background:#c0392b}
.note{font-size:12.5px;color:var(--mut);line-height:1.5;margin-top:20px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.5);border:1px dashed rgba(28,20,23,.15)}
.note a{color:var(--maroon);font-weight:600}
.banner{font-size:13px;line-height:1.45;background:#fff6ee;border:1px solid #f6dcc4;color:#7a4a1f;border-radius:14px;padding:10px 12px;margin-bottom:14px}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}
/* saved meals */
.pill.savebtn{cursor:pointer;border:0;color:#fff;font:inherit;font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;transition:background .15s,transform .15s}
.pill.savebtn:hover{background:rgba(255,255,255,.3);transform:translateY(-1px)}
.pill.savebtn.on{background:#fff;color:var(--maroon)}
.saved{margin-top:30px;scroll-margin-top:16px}
.sempty{display:flex;gap:14px;align-items:center;padding:16px;border-radius:18px;border:1.5px dashed rgba(134,31,65,.25);background:rgba(255,255,255,.45)}
.sempty .big{font-size:26px;color:var(--maroon);width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:13px;background:#fff;border:1px solid var(--line)}
.sempty b{display:block;font-size:14.5px}
.sempty small{display:block;color:var(--mut);font-size:13px;line-height:1.45;margin-top:2px}
.sempty small b{display:inline;color:var(--maroon)}
.install{margin-top:22px;display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,rgba(134,31,65,.08),rgba(229,117,31,.10));border:1px solid rgba(134,31,65,.15)}
.install img{width:46px;height:46px;border-radius:12px;flex:none;box-shadow:0 6px 16px -8px rgba(134,31,65,.6)}
.install b{display:block;font-size:14.5px}
.install small{display:block;color:var(--mut);font-size:12.5px;margin-top:1px}
.install .go{margin-left:auto;background:var(--maroon);color:#fff;font-weight:700;font-size:13.5px;padding:9px 14px;border-radius:99px;white-space:nowrap}
.install .no{color:var(--mut);font-size:18px;width:26px;height:26px;flex:none}
.sheet{position:fixed;inset:0;background:rgba(28,20,23,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30;animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.sheet .card{background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 22px calc(26px + env(safe-area-inset-bottom));animation:in .35s cubic-bezier(.2,.8,.2,1) both}
.sheet h3{font-size:20px;font-weight:800;margin-bottom:12px}
.sheet ol{padding-left:0;list-style:none;display:grid;gap:12px;counter-reset:s}
.sheet li{display:flex;gap:12px;align-items:center;font-size:15px;line-height:1.5;counter-increment:s}
.sheet li::before{content:counter(s);width:26px;height:26px;flex:none;border-radius:50%;background:var(--maroon);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center}
.sheet .ic{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:#f1edee;font-size:15px;vertical-align:middle}
.sheet .cta{width:100%;justify-content:center;margin-top:18px}
.savebig{width:100%;margin-top:14px;display:flex;justify-content:center;align-items:center;gap:8px;padding:14px 20px;border-radius:99px;font-weight:700;font-size:15px;background:#fff;color:var(--maroon);border:1.5px solid var(--maroon);transition:transform .15s,background .15s}
.savebig:hover{transform:translateY(-1px)}
.savebig.on{background:var(--maroon);color:#fff}
.tosaved{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--maroon);background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:5px 11px;white-space:nowrap}
.tosaved:hover{background:#fff}
.saved-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.saved-h h3{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.7px}
.saved-h span{font-size:12.5px;color:var(--mut)}
.scard{display:flex;gap:12px;align-items:center;padding:13px 14px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;margin-bottom:9px;animation:in .5s cubic-bezier(.2,.8,.2,1) both}
.scard .open{flex:1;min-width:0;text-align:left;display:flex;gap:12px;align-items:center}
.scard .em{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,#fff,#f4ebee);border:1px solid var(--line)}
.scard .n{font-weight:700;font-size:14.5px;line-height:1.25}
.scard .n span{font-weight:600;color:var(--mut);font-size:13px}
.scard .items{font-size:13px;color:var(--ink);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .meta{font-size:12px;color:var(--mut);margin-top:3px}
.scard .x{width:30px;height:30px;flex:none;border-radius:50%;color:var(--mut);font-size:18px;line-height:1}
.scard .x:hover{background:rgba(28,20,23,.06);color:var(--ink)}
.avail{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.avail::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.avail.no::before{background:#b9adb1}
.avail.closed::before{background:var(--orange)}
.savedtag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--maroon);background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:99px;padding:6px 12px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-size:14px;font-weight:600;padding:11px 16px;border-radius:99px;display:flex;gap:12px;align-items:center;opacity:0;pointer-events:none;transition:.25s;z-index:20;box-shadow:0 12px 30px -10px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{color:var(--orange-2);font-weight:700}
.restart{margin-top:18px;width:100%;justify-content:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:440px){.mrow{grid-template-columns:repeat(2,1fr)}.hero h2{font-size:21px}}
</style>

<body>
<div class="blob b1" id="b1"></div><div class="blob b2" id="b2"></div>
<div class="shell">
  <div class="top">
    <div class="brand"><div class="logo">🦃</div>Hokie Fuel</div>
    <div class="counter"><span class="dot"></span><b id="count">0</b> <span id="countLbl">options</span></div>
  </div>
  <div class="fresh" id="fresh"></div>
  <div class="steps" id="steps"></div>
  <div class="stage" id="stage"><div class="view loading"><div class="spinner"></div><p class="sub">Loading today's menus…</p></div></div>
</div>

<script>
/*LOGIC-START*/
/* =====================================================================
   Hokie Fuel — recommendation logic (pure functions, no DOM)
   ===================================================================== */
const DATA_URL = "data/today.json";

/* Eastern-time clock (VT is in Blacksburg, so always use ET) */
function etNow(d = new Date()) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", {
    timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(d).map(x => [x.type, x.value]));
  const h = +p.hour % 24, m = +p.minute;
  return { iso: `${p.year}-${p.month}-${p.day}`, mins: h * 60 + m, hour: h };
}
const toMins = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
function fmtTime(t) { let [h, m] = t.split(":").map(Number); const ap = h >= 12 && h < 24 ? "PM" : "AM"; h = h % 12 || 12; return m ? `${h}:${String(m).padStart(2, "0")} ${ap}` : `${h} ${ap}`; }

function periodAt(mins) { return mins < 630 ? "b" : mins < 960 ? "l" : "d"; } // before 10:30 breakfast, before 4pm lunch

/** Is a location open at `mins`? Handles windows that run past midnight (e.g. 6pm–2am). */
function openStatus(loc, mins) {
  if (!loc.hours || !loc.hours.length) return { open: true, unknown: true };
  let open = false, closes = null, closesMin = -1, opensNext = null;
  for (const h of loc.hours) {
    if (!h.open || !h.close) continue;
    const o = toMins(h.open); let c = toMins(h.close);
    if (c <= o) c += 1440;                                   // window runs past midnight (e.g. 6pm–2am)
    const today = mins >= o && mins < c;                     // inside today's window
    const spill = mins + 1440 >= o && mins + 1440 < c;       // still inside last night's window
    if (today || spill) {
      open = true;
      const end = today ? c : c - 1440;
      if (end > closesMin) { closesMin = end; closes = h.close; }
    } else if (o > mins && (opensNext === null || o < toMins(opensNext))) opensNext = h.open;
  }
  return { open, closes, opensNext };
}

/* ----------------------- scoring ----------------------- */
const HUNGER = { snack: [200, 450], meal: [450, 850], starving: [850, 1400] };
function goalKey(a) { return a.goal === "train" ? (a.timing === "before" ? "pre" : "rec") : a.goal; }
function calRange(a) {
  const g = goalKey(a);
  if (g === "pre") return [250, 600];
  if (g === "rec") return [450, 950];
  return HUNGER[a.hunger] || HUNGER.meal;
}

function sumPlate(items) {
  const t = { cal: 0, p: 0, c: 0, f: 0, fib: 0, sod: 0, sug: 0 };
  for (const i of items) for (const k in t) t[k] += i[k] || 0;
  return t;
}

/** Score a plate's totals for the user's goal. Returns {s, why[]} */
function scorePlate(t, a) {
  const g = goalKey(a), why = [];
  const cal = Math.max(t.cal, 1), pd = t.p / cal * 100, cP = t.c * 4 / cal, fP = t.f * 9 / cal;
  let s = 50;
  if (g === "rec") {
    s += Math.min(t.p, 50) * .6 + Math.min(t.c, 100) * .25;
    const r = t.c / Math.max(t.p, 1);
    if (r >= 1.2 && r <= 3.5) { s += 10; why.push(`${r.toFixed(1)}:1 carbs to protein, right for refueling`); }
    if (t.p >= 30) why.push(`${t.p}g protein to start muscle repair`);
    if (fP > .4) s -= 12;
  } else if (g === "pre") {
    s += cP * 60 - fP * 70 - t.fib * 1.2 + Math.min(t.p, 25) * .4;
    if (cP >= .5) why.push(`${Math.round(cP * 100)}% of calories from carbs for fast energy`);
    if (fP < .3) why.push("Low in fat, so it won't sit heavy mid-workout");
    if (t.fib <= 8) why.push("Moderate fiber, easy on your stomach");
  } else if (g === "protein") {
    s += pd * 5 + Math.min(t.p, 70) * .4 + (t.c >= 30 ? 6 : 0);
    why.push(`${t.p}g protein (${pd.toFixed(1)}g per 100 calories)`);
    if (t.c >= 40) why.push("Enough carbs to put that protein to work");
  } else if (g === "lean") {
    s += pd * 4 + t.fib * 1.5 - t.cal / 25;
    if (t.cal <= 550) why.push(`Only ${t.cal} calories for the whole plate`);
    if (pd >= 7) why.push("High protein for its size keeps you full");
    if (t.fib >= 8) why.push(`${t.fib}g fiber for staying power`);
  } else if (g === "bulk") {
    s += Math.min(t.cal, 1600) / 18 + Math.min(t.p, 90) * .5;
    why.push(`${t.cal} calories and ${t.p}g protein toward your surplus`);
  } else if (g === "focus") {
    s += t.fib * 2 + Math.min(t.p, 40) * .4 - Math.max(0, fP - .35) * 60 - Math.max(0, t.cal - 750) / 15 - Math.max(0, t.sug - 30) / 3;
    if (t.fib >= 7) why.push(`${t.fib}g fiber releases energy slowly`);
    if (t.p >= 20) why.push("Protein + complex carbs help you avoid a crash");
  }
  const [lo, hi] = calRange(a);
  if (t.cal >= lo && t.cal <= hi) s += 12;
  else s -= Math.min(30, (t.cal < lo ? lo - t.cal : t.cal - hi) / 15);
  if (g !== "bulk" && t.sod > 1500) s -= Math.min(10, (t.sod - 1500) / 200);
  return { s, why };
}

/* Quick per-item ranking used to shortlist sides before trying combinations */
function sideValue(i, g) {
  switch (g) {
    case "rec": return i.c * .5 + i.p;
    case "pre": return i.c - i.f * 2 - i.fib;
    case "protein": return i.p * 2 - i.f * .3;
    case "lean": return i.fib * 3 + i.p - i.cal / 30;
    case "bulk": return i.cal / 10 + i.p;
    default: return i.fib * 3 + i.p * .5 - i.sug * .5;
  }
}

/** Two items are "the same thing" if they share their first two words (e.g. two chia puddings). */
function similar(a, b) {
  const k = x => x.n.toLowerCase().replace(/[^a-z ]/g, "").split(/\s+/).filter(Boolean).slice(0, 2).join(" ");
  return k(a) === k(b);
}

function dietOK(item, diet) {
  if (!diet || !diet.length || diet.includes("none")) return true;
  return diet.every(d => item.v.includes(d));
}

/** Which counter an item comes from. All-you-care-to-eat halls (mix) count as one counter. */
function stationOf(loc, item) {
  if (loc.mix || !loc.stations || !loc.stations.length) return { key: loc.num, name: loc.name, hours: loc.hours, whole: true };
  const st = loc.stations[item.s] || { name: loc.name, hours: [] };
  return { key: `${loc.num}:${item.s}`, name: st.name, hours: st.hours && st.hours.length ? st.hours : loc.hours, whole: false };
}

/** All items a student could get right now, filtered by period & diet. */
function eligible(data, a, now) {
  const period = periodAt(now.mins), out = [];
  for (const loc of data.locations) {
    for (const it of loc.items) {
      if (!it.m.includes(period)) continue;
      if (!dietOK(it, a.diet)) continue;
      out.push({ ...it, loc, station: stationOf(loc, it) });
    }
  }
  return out;
}

/** Count of main options matching answers so far (for the live counter). */
function countOptions(data, a, now) {
  const [lo, hi] = calRange(a);
  return eligible(data, a, now).filter(i => i.role === "main" && openStatus(i.station, now.mins).open &&
    (!a.goal || (i.cal <= hi + 150)) && (!a.hunger || i.cal >= lo * .45)).length;
}

/* ---------- build-your-own counters (Tazon, Rambutan, Burger '37 ...) ---------- */
const STEP_ORDER = ["bread", "base", "broth", "protein", "cheese", "topping", "sauce"];
const STEP_LABEL = { bread: "Bread / bun", base: "Base", broth: "Broth", protein: "Protein", cheese: "Cheese", topping: "Toppings", sauce: "Sauce" };
function compValue(i, k, g) {
  if (k === "protein") return g === "lean" ? i.p - i.cal / 20 : g === "pre" ? i.p - i.f * 3 : g === "focus" ? i.p - i.f : i.p;
  if (k === "topping") switch (g) {
    case "lean": return i.fib * 3 + i.p - i.cal / 15;
    case "protein": return i.p * 2 - i.f * .5 + i.fib;
    case "rec": return i.c * .5 + i.p - i.f * .5;
    case "pre": return i.c - i.f * 2 - i.fib;
    case "bulk": return i.cal / 10 + i.p;
    default: return i.fib * 3 + i.p * .5 - i.f * .3;
  }
  return sideValue(i, g);
}
function subsets(arr, max) {
  const out = [[]];
  for (const x of arr) { const n = out.length; for (let j = 0; j < n; j++) if (out[j].length < max) out.push([...out[j], x]); }
  return out;
}
/** Try combinations of a build-your-own counter's choices and return the best one with ordering steps. */
function bestBuild(comps, a, meta = {}) {
  const g = goalKey(a), [lo] = calRange(a);
  const by = k => comps.filter(i => i.k === k);
  const top = (k, n) => by(k).sort((x, y) => compValue(y, k, g) - compValue(x, k, g)).slice(0, n);
  const has = k => by(k).length > 0;
  if (!has("base") && !has("bread") && !has("broth")) return null;
  const opts = {
    base: has("base") ? top("base", 3) : [null],
    bread: has("bread") ? (has("base") ? [null, ...top("bread", 2)] : top("bread", 3)) : [null],
    broth: has("broth") ? top("broth", 2) : [null],
    protein: has("protein") ? top("protein", 4) : [null],
    cheese: [null, ...top("cheese", 2)],
    sauce: meta.pasta && has("sauce") ? top("sauce", 3) : [null, ...top("sauce", 3)],   // pasta always gets a sauce
  };
  const toppingSets = subsets(top("topping", 5), 4);
  let best = null;
  for (const base of opts.base) for (const bread of opts.bread) for (const broth of opts.broth)
  for (const prot of opts.protein) for (const cheese of opts.cheese) for (const sauce of opts.sauce)
  for (const tops of toppingSets) {
    const plate = [bread, base, broth, prot, cheese, ...tops, sauce].filter(Boolean);
    const t = sumPlate(plate);
    if (t.cal < lo * .75) continue;
    let { s, why } = scorePlate(t, a);
    s -= Math.max(0, plate.length - 4) * .6;                 // don't pile on toppings for no reason
    if (!best || s > best.s) best = { plate, t, s, why, pick: { bread, base, broth, protein: prot, cheese, sauce, topping: tops } };
  }
  if (!best) return null;
  best.steps = STEP_ORDER.filter(k => has(k)).map(k => {
    const chosen = k === "topping" ? best.pick.topping : best.pick[k] ? [best.pick[k]] : [];
    return { k, label: STEP_LABEL[k], items: chosen };
  });
  const chosenTops = new Set(best.pick.topping.map(i => i.n));
  best.skip = by("topping").filter(i => !chosenTops.has(i.n) && i.cal >= 50).sort((x, y) => y.cal - x.cal).slice(0, 3);
  return best;
}

/** Build the best plate (1 main + up to 2 sides) at each counter, ranked.
    Every item on a plate comes from the same counter, so it's one line to order from. */
function recommend(data, a, now) {
  const g = goalKey(a), items = eligible(data, a, now);
  const byStation = new Map();
  for (const i of items) { if (!byStation.has(i.station.key)) byStation.set(i.station.key, []); byStation.get(i.station.key).push(i); }

  let results = [];
  for (const list of byStation.values()) {
    const loc = list[0].loc, station = list[0].station;
    const status = openStatus(station, now.mins);
    const mains = list.filter(i => i.role === "main")
      .map(i => ({ i, s: scorePlate(sumPlate([i]), a).s })).sort((x, y) => y.s - x.s).slice(0, 15).map(x => x.i);
    const sidePool = list.filter(i => i.role === "side" || i.role === "drink+");
    const sides = [...new Set([
      ...[...sidePool].sort((x, y) => sideValue(y, g) - sideValue(x, g)).slice(0, 10),      // best for the goal
      ...[...sidePool].sort((x, y) => (y.c + y.fib * 3) - (x.c + x.fib * 3)).slice(0, 5),  // plus carbs/veg for balance
    ])];
    const [lo] = calRange(a);
    const isProtein = i => i.p >= 8 && i.p * 4 / Math.max(i.cal, 1) >= .3 && i.c < 15;      // meat/tofu-type item
    const isBread = i => /\b(bread|roll|bagel|tortilla|biscuit|croissant|pita|baguette|bun|toast)s?\b/i.test(i.n);
    let best = null;
    for (const m of mains) {
      const combos = [[m]];
      for (let x = 0; x < sides.length; x++) {
        if (similar(m, sides[x]) || (g !== "bulk" && isProtein(m) && isProtein(sides[x]))) continue;
        combos.push([m, sides[x]]);
        for (let y = x + 1; y < sides.length; y++) {
          if (sides[x].role === "drink+" && sides[y].role === "drink+") continue;
          if (g !== "bulk" && [m, sides[x], sides[y]].filter(isProtein).length > 1) continue; // one protein per plate
          if (isBread(sides[x]) && isBread(sides[y])) continue;
          if (similar(sides[x], sides[y]) || similar(m, sides[y])) continue;
          combos.push([m, sides[x], sides[y]]);
        }
      }
      for (const plate of combos) {
        const t = sumPlate(plate);
        if (t.cal < lo * .75) continue;                                     // too small to be this meal
        let { s, why } = scorePlate(t, a);
        s -= (plate.length - 1) * 2.5;                                        // simpler is better
        if (plate.length > 1 && plate.slice(1).every(p => p.st === m.st)) s += 1;
        if (!best || s > best.s) best = { plate, t, s, why };
      }
    }
    // build-your-own counters inside this station
    const byBuild = new Map();
    for (const i of list) if (i.role === "comp") { if (!byBuild.has(i.b)) byBuild.set(i.b, []); byBuild.get(i.b).push(i); }
    for (const [bIdx, comps] of byBuild) {
      const bb = bestBuild(comps, a, (loc.builds && loc.builds[bIdx]) || {});
      if (!bb) continue;
      const name = (loc.builds && loc.builds[bIdx] && loc.builds[bIdx].name) || station.name;
      bb.why = [...bb.why];
      if (a.where && a.where !== "any" && loc.area === a.where) { bb.s += 8; bb.why.push(`Close to you at ${loc.name}`); }
      if (!status.open) bb.s -= 1000;
      bb.loc = loc; bb.status = status; bb.why = bb.why.slice(0, 3);
      bb.station = { ...station, name, whole: false };
      results.push(bb);
    }
    if (!best) continue;
    best.why = [...best.why];
    if (a.where && a.where !== "any" && loc.area === a.where) { best.s += 8; best.why.push(`Close to you at ${loc.name}`); }
    if (!status.open) best.s -= 1000; // closed places sink to the bottom
    best.loc = loc; best.station = station; best.status = status; best.why = best.why.slice(0, 3);
    results.push(best);
  }
  results.sort((x, y) => y.s - x.s);
  const anyOpen = results.some(r => r.status.open);
  if (anyOpen) results = results.filter(r => r.status.open);
  // variety: at most 2 counters from the same dining hall in the top picks
  const perHall = new Map(), picked = [];
  for (const r of results) {
    const n = perHall.get(r.loc.num) || 0;
    if (n >= 2) continue;
    perHall.set(r.loc.num, n + 1); picked.push(r);
    if (picked.length === 4) break;
  }
  return { plates: picked, nothingOpen: !anyOpen && results.length > 0 };
}
/*LOGIC-END*/

    </div>

    stage.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const v = b.dataset.v;
      if (q.multi) {
        let arr = ans[key];
        if (v === "none") arr = arr.includes("none") ? [] : ["none"];
        else { arr = arr.filter(x => x !== "none"); arr = arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v]; }
        ans[key] = arr;
        stage.querySelectorAll(".opt").forEach(x => { const on = arr.includes(x.dataset.v); x.classList.toggle("sel", on); x.querySelector(".chk").textContent = on ? "✓" : ""; });
        stage.querySelector(".cta").disabled = !arr.length;

/* Emoji for a food, matched on its name. Order matters: the dish type wins over its ingredients
   ("Chicken Burrito" -> burrito, "Green Beans" -> pea pod, "Sweet Potato" before "Potato"). */

  [/\b(sandwich|sub|hoagie|panini|melt|club|blt|slider)s?\b/, "🥪"], [/\bsushi|maki|nigiri|roll combo/, "🍣"],
  [/\b(noodles?|ramen|pho|lo mein|udon|soba|pad thai)\b/, "🍜"], [/\b(pasta|penne|spaghetti|rigatoni|fettuccine|linguine|ravioli|tortellini|lasagna|alfredo|mac (and|&|n) cheese|macaroni|ziti|gnocchi)\b/, "🍝"],
  [/\b(soup|chili|stew|chowder|bisque|broth|gumbo)\b/, "🍲"], [/\bcurry|tikka|masala\b/, "🍛"], [/\bsalad\b/, "🥗"],
  [/\b(pancakes?|waffles?|french toast)\b/, "🥞"], [/\b(oatmeal|oats|cereal|granola|bran|cheerios|flakes|grits)\b/, "🥣"],
  [/\b(yogurt|parfait)\b/, "🥣"], [/\b(smoothie|shake|refresher|juice)\b/, "🥤"], [/\b(milk)\b/, "🥛"],
  [/\b(tofu|sofritas|tempeh|seitan|impossible|beyond|incogmeato|meatless|plant[- ]based)\b/, "🌱"], [/\b(falafel|hummus)\b/, "🧆"], [/\b(lentils?|chickpeas?|dal)\b/, "🫘"],
  [/\b(omelet|omelette|eggs?|frittata|scramble)\b/, "🍳"], [/\bbacon\b/, "🥓"], [/\bsausage|chorizo|pepperoni|salami\b/, "🌭"],
  [/\b(wings?|drumsticks?|tenders?|nuggets?|chicken|rotisserie)\b/, "🍗"], [/\bturkey\b/, "🦃"],
  [/\b(steak|beef|carne asada|brisket|barbacoa|meatballs?|bulgogi)\b/, "🥩"], [/\b(pork|ham|lamb|ribs?|gyro|pulled)\b/, "🍖"],
  [/\b(shrimp|prawns?|tempura)\b/, "🍤"], [/\b(salmon|tuna|fish|tilapia|cod|pollock|catfish|trout|mahi|swordfish)\b/, "🐟"],
   
  [/\b(green beans?|peas|edamame|snap peas)\b/, "🫛"], [/\b(beans?|refried)\b/, "🫘"],
  [/\b(fried rice|rice)\b/, "🍚"], [/\b(quinoa|couscous|farro|bulgur|grain bowl)\b/, "🌾"],
  [/\bsweet potato(es)?|yams?\b/, "🍠"], [/\b(fries|tots|tater)\b/, "🍟"], [/\b(potato(es)?|hash ?browns?|home fries|wedges)\b/, "🥔"],
  [/\b(cheese|mozzarella|cheddar|provolone|feta|parmesan|swiss|pepper jack|american)\b/, "🧀"], [/\b(bread|roll|bun|toast|biscuit|pita|naan|baguette|ciabatta|tortilla|focaccia|flatbread|english muffin|boule)s?\b/, "🍞"],
  [/\bbroccoli\b/, "🥦"], [/\bcorn\b/, "🌽"], [/\bcarrots?\b/, "🥕"], [/\b(cucumbers?|pickles?)\b/, "🥒"],
  [/\b(peppers?|fajita veg|jalape)/, "🫑"], [/\bmushrooms?\b/, "🍄"], [/\bonions?\b/, "🧅"], [/\bgarlic\b/, "🧄"],
  [/\b(tomato(es)?|pico|salsa|marinara)\b/, "🍅"], [/\b(avocado|guacamole|guac)\b/, "🥑"], [/\beggplant\b/, "🍆"],
  [/\b(lettuce|romaine|spinach|kale|greens|arugula|cabbage|slaw|asparagus|zucchini|squash|vegetables?|veggies)\b/, "🥬"],
  [/\bbagels?\b/, "🥯"], [/\bcroissants?\b/, "🥐"], [/\b(pretzel)s?\b/, "🥨"],
  
  
  [/\bbananas?\b/, "🍌"], [/\bapples?\b/, "🍎"], [/\boranges?|clementines?\b/, "🍊"], [/\bstrawberr/, "🍓"],
  [/\b(blueberr|berries|mixed berr)/, "🫐"], [/\bgrapes?\b/, "🍇"], [/\b(melon|cantaloupe|honeydew)\b/, "🍈"],
  [/\bwatermelon\b/, "🍉"], [/\bpineapple\b/, "🍍"], [/\b(fruit|peach|mango|pear)/, "🍑"],
   [/\b(cookie|brownie)s?\b/, "🍪"], [/\b(cake|cupcake|muffin|pastry|danish)s?\b/, "🧁"],

function foodEmoji(item) {
  const n = (item.n || "").toLowerCase();
  for (const [re, e] of FOOD_EMOJI) if (re.test(n)) return e;
  return item.role === "drink+" ? "🥤" : item.role === "side" ? "🍴" : "🍽️";   // neutral fallback, never a wrong food
}

const SKIP_TEXT = { bread: "No bread, make it a bowl", base: "No base", broth: "No broth", protein: "No protein", cheese: "Skip the cheese", topping: "No toppings", sauce: "No sauce" };
function orderSteps(top) {

/* ---------------- saved meals (kept in this browser) ---------------- */
const SAVE_KEY = "hokiefuel:saved:v1";
let SAVED = (() => { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || []; } catch (e) { return []; } })();
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVED)); return true; } catch (e) { return false; } }
const mealId = p => `${p.loc.num}|${p.station.name}|${p.plate.map(i => i.id).sort().join(",")}`;
const isSaved = p => SAVED.some(m => m.id === mealId(p));
function goalLabel(a) {
  const g = Q.goal.opts.find(o => o.v === a.goal);
  if (a.goal === "train") return a.timing === "before" ? "Pre-workout" : "Post-workout recovery";
  return g ? g.t : "";
}
function snapshot(p) {
  const pick = i => ({ id: i.id, n: i.n, por: i.por, st: i.st, role: i.role, k: i.k, cal: i.cal, p: i.p, c: i.c, f: i.f, fib: i.fib, sod: i.sod, al: i.al });
  return {
    id: mealId(p), savedAt: Date.now(), goal: goalLabel(ans),
    num: p.loc.num, hall: p.loc.name, station: p.station.name, whole: !!p.station.whole,
    items: p.plate.map(pick),
    steps: p.steps ? p.steps.map(s => ({ k: s.k, label: s.label, ids: s.items.map(i => i.id) })) : null,
    t: { cal: p.t.cal, p: p.t.p, c: p.t.c, f: p.t.f, fib: p.t.fib, sod: p.t.sod },
  };
}
function toggleSave(p) {
  const id = mealId(p);
  const was = SAVED.findIndex(m => m.id === id);
  if (was >= 0) SAVED.splice(was, 1); else SAVED.unshift(snapshot(p));
  const ok = persist();
  toast(was >= 0 ? "Removed from saved meals" : ok ? "Saved ♥ Find it on the home screen" : "Saved for now, but this browser won't keep it after you close the page");
  return was < 0;
}
function removeSaved(id) {
  const k = SAVED.findIndex(m => m.id === id); if (k < 0) return;
  const [gone] = SAVED.splice(k, 1); persist();
  toast("Meal removed", "Undo", () => { SAVED.splice(k, 0, gone); persist(); if (idx === 0 && document.querySelector(".saved, .opts")) ask(); });
}
/** Is a saved meal on today's menu, served at this time of day, and open? */
function savedAvailability(m) {
  if (!DATA) return { onMenu: false };
  const loc = DATA.locations.find(l => l.num === m.num);
  const byId = new Map((loc ? loc.items : []).map(i => [i.id, i]));
  const missing = m.items.filter(i => !byId.has(i.id));
  if (!loc || missing.length) return { onMenu: false, missing };
  const period = periodAt(NOW.mins);
  const servedNow = m.items.every(i => byId.get(i.id).m.includes(period));
  const status = openStatus(stationOf(loc, byId.get(m.items[0].id)), NOW.mins);
  return { onMenu: true, servedNow, status };
}
function availText(m) {
  const a = savedAvailability(m);
  if (!a.onMenu) return `<span class="avail no">Not on today's menu</span>`;
  if (!a.servedNow) return `<span class="avail closed">On today's menu · not served at ${MEALWORD}</span>`;
  if (a.status.unknown || a.status.open) return `<span class="avail">On today's menu · ${a.status.closes ? `open until ${fmtTime(a.status.closes)}` : "open now"}</span>`;
  return `<span class="avail closed">On today's menu · ${a.status.opensNext ? `opens ${fmtTime(a.status.opensNext)}` : "closed now"}</span>`;

let toastTimer;
function toast(msg, actionLabel, action) {
  let el = document.querySelector(".toast");
  if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.innerHTML = `<span>${esc(msg)}</span>${actionLabel ? `<button>${esc(actionLabel)}</button>` : ""}`;
  if (actionLabel) el.querySelector("button").onclick = () => { el.classList.remove("show"); action(); };
  el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 3500);
}

}
function restart() { ans = {}; idx = 0; ask(); }

/* ---------------- install as an app (PWA) ---------------- */
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (idx === 0 && document.querySelector(".opts")) refreshInstall(); });
window.addEventListener("appinstalled", () => { installEvt = null; toast("Hokie Fuel is on your home screen 🎉"); refreshInstall(); });
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const canInstallHere = () => "serviceWorker" in navigator && window.isSecureContext && window.self === window.top && !isStandalone();
function installDismissed() { try { return localStorage.getItem("hokiefuel:install-dismissed") === "1"; } catch (e) { return false; } }
function installCard() {
  if (!canInstallHere() || installDismissed() || !(installEvt || isIOS())) return "";
  return `<div class="install" id="installCard">
    <img src="icons/icon-192.png" alt="">
    <div><b>Get the Hokie Fuel app</b><small>Add it to your home screen. Free, no app store.</small></div>
    <button class="go" id="installGo">Install</button>
    <button class="no" id="installNo" aria-label="Hide install suggestion">×</button>
  </div>`;
}
function bindInstall() {
  const go = document.getElementById("installGo"), no = document.getElementById("installNo");
  if (go) go.onclick = async () => {
    if (installEvt) { installEvt.prompt(); const r = await installEvt.userChoice; installEvt = null; if (r.outcome !== "accepted") refreshInstall(); }
    else if (isIOS()) iosSheet();
  };
  if (no) no.onclick = () => { try { localStorage.setItem("hokiefuel:install-dismissed", "1"); } catch (e) {} document.getElementById("installCard").remove(); };
}
function refreshInstall() {
  const old = document.getElementById("installCard"), saved = document.querySelector(".saved");
  if (old) old.remove();
  if (saved) { saved.insertAdjacentHTML("afterend", installCard()); bindInstall(); }
}
function iosSheet() {
  const el = document.createElement("div"); el.className = "sheet";
  el.innerHTML = `<div class="card" role="dialog" aria-label="Install Hokie Fuel">
    <h3>Add Hokie Fuel to your iPhone</h3>
    <ol>
      <li><span>Tap the Share button <span class="ic">⬆︎</span> at the bottom of Safari</span></li>
      <li><span>Scroll down and tap <b>Add to Home Screen</b> <span class="ic">＋</span></span></li>
      <li><span>Tap <b>Add</b>. Hokie Fuel is now on your home screen</span></li>
    </ol>
    <button class="cta">Got it</button></div>`;
  el.onclick = e => { if (e.target === el || e.target.classList.contains("cta")) el.remove(); };
  document.body.appendChild(el);
}
if ("serviceWorker" in navigator && window.isSecureContext && window.self === window.top) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

async function boot() {
  const fresh = document.getElementById("fresh");
  try {
    const r = await fetch(DATA_URL, { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json();
    DATA.locations = DATA.locations.filter(l => l.items && l.items.length);
    const updated = new Date(DATA.generatedAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    const stale = DATA.date !== NOW.iso;
    fresh.innerHTML = stale
      ? `<i style="background:#c0392b"></i>Showing menu from ${esc(DATA.date)}, today's isn't posted yet`
      : `<i></i>Today's live menu · ${DATA.locations.length} dining halls · updated ${updated}`;
  } catch (e) {
    DATA = DEMO;
    fresh.className = "fresh demo";
    fresh.innerHTML = `<i></i>Sample menu (made-up items) · real VT menus load once deployed`;
  }
  stage.innerHTML = "";
  ask();
}
boot();
</script>
